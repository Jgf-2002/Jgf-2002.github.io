<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">量化研究实习三条工作主线</title>
  <desc id="desc">Tushare、聚源 JY 与 AkShare 数据经过落盘、标准化、PIT 对齐和质量检查后，分别支持中低频 Alpha 与 Beta 因子研究。</desc>
  <defs>
    <filter id="paperNoise" x="-3%" y="-5%" width="106%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.75"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#587fa2"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#cf7431"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#3f9164"/></marker>
    <style>
      .bg{fill:#fcfbf8}.ink{fill:#24364a}.muted{fill:#728092}.label{font:italic 15px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif;letter-spacing:.04em}.small{font:12px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif}.tiny{font:10px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif}.node-title{font:700 17px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif;fill:#20334a}.node-code{font:italic 11px 'Segoe Print','KaiTi',sans-serif;fill:#4779b7}.lane{fill:none;stroke-width:1.6;stroke-dasharray:8 7}.node{stroke-width:1.4;filter:url(#paperNoise)}.blue-fill{fill:#e9f0f7;stroke:#7fa5cb}.gray-fill{fill:#f2f3f4;stroke:#aab1ba}.gold-fill{fill:#f5f0df;stroke:#c8aa62}.green-fill{fill:#eaf3ed;stroke:#7fa58b}.purple-fill{fill:#f1edf7;stroke:#9e7bc2}.orange-fill{fill:#f8eee7;stroke:#d79364}.flow{fill:none;stroke:#6685a8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#cf7431;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round}.pass{fill:none;stroke:#3f9164;stroke-width:2.2;stroke-linecap:round}
    </style>
  </defs>

  <rect class="bg" width="1200" height="660" rx="18"/>
  <text x="30" y="38" class="label ink" style="font-size:22px">量化研究实习 / Quant Research Internship</text>
  <text x="31" y="63" class="small muted">多源数据工程 → 中低频 Alpha → 中低频 Beta</text>
  <g filter="url(#paperNoise)"><rect x="700" y="20" width="467" height="48" rx="12" fill="#eef4f8" stroke="#b9cfdf"/></g>
  <text x="720" y="40" class="tiny muted">131 GB Research Data · 253 Factor Specs · 178 Implementations</text>
  <text x="720" y="57" class="tiny muted">790+ Beta Candidates · PIT / OOS / Deterministic Validation</text>

  <rect x="25" y="92" width="1150" height="183" rx="18" class="lane" stroke="#83abd0"/>
  <text x="45" y="120" class="label muted">01 DATA ENGINEERING / 多源数据落盘与研究底座</text>
  <text x="862" y="119" class="tiny muted">collect → normalize → as-of → quality</text>
  <g transform="translate(55 145)">
    <rect width="150" height="88" rx="12" class="node blue-fill"/>
    <text x="15" y="24" class="node-code">D0 / TUSHARE</text><text x="15" y="49" class="node-title">A 股与多资产</text><text x="15" y="70" class="tiny muted">量价 · 财务 · 指数等</text>
  </g>
  <g transform="translate(225 145)">
    <rect width="150" height="88" rx="12" class="node purple-fill"/>
    <text x="15" y="24" class="node-code">D1 / JY</text><text x="15" y="49" class="node-title">财务与分析师</text><text x="15" y="70" class="tiny muted">公告事件 · PIT 历史</text>
  </g>
  <g transform="translate(395 145)">
    <rect width="150" height="88" rx="12" class="node gold-fill"/>
    <text x="15" y="24" class="node-code">D2 / AKSHARE</text><text x="15" y="49" class="node-title">海外市场补充</text><text x="15" y="70" class="tiny muted">指数 · ADR · 商品</text>
  </g>
  <g transform="translate(605 145)">
    <rect width="210" height="88" rx="12" class="node gray-fill"/>
    <text x="15" y="24" class="node-code">D3 / LAND &amp; ALIGN</text><text x="15" y="49" class="node-title">落盘与统一口径</text><text x="15" y="70" class="tiny muted">代码 · 字段 · 交易日 · 公告日</text>
  </g>
  <g transform="translate(875 145)">
    <rect width="250" height="88" rx="12" class="node green-fill"/>
    <text x="15" y="24" class="node-code">D4 / PIT &amp; QUALITY</text><text x="15" y="49" class="node-title">PIT 数据与质量闭环</text><text x="15" y="70" class="tiny muted">增量更新 · 补采 · 审计 · 原子输出</text>
  </g>
  <path d="M205 189C213 182 217 182 223 189" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M375 189C383 182 387 182 393 189" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M548 189C568 176 583 176 603 189" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M817 189C837 176 852 176 873 189" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M1000 236C1008 285 775 285 735 319" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M1000 236C988 285 422 282 383 319" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="25" y="310" width="555" height="270" rx="18" class="lane" stroke="#8eb6d9"/>
  <text x="45" y="338" class="label muted">02 ALPHA RESEARCH / 中低频 Alpha</text>
  <g transform="translate(55 365)">
    <rect width="215" height="83" rx="12" class="node blue-fill"/>
    <text x="14" y="23" class="node-code">A0 / FUNDAMENTAL</text><text x="14" y="48" class="node-title">基本面与分析师预期</text><text x="14" y="68" class="tiny muted">价值 · 质量 · 成长 · 现金流</text>
  </g>
  <g transform="translate(310 365)">
    <rect width="215" height="83" rx="12" class="node purple-fill"/>
    <text x="14" y="23" class="node-code">A1 / PRICE–VOLUME</text><text x="14" y="48" class="node-title">量价候选信号</text><text x="14" y="68" class="tiny muted">日频输入 · 中低频收益窗口</text>
  </g>
  <g transform="translate(105 480)">
    <rect width="370" height="70" rx="12" class="node green-fill"/>
    <text x="15" y="23" class="node-code">A2 / IMPLEMENT &amp; EVALUATE</text><text x="15" y="46" class="node-title">Dolphin / PySim 实现与批量检验</text><text x="15" y="62" class="tiny muted">coverage · IC / RankIC · annual stability · 5 / 10 / 20d</text>
  </g>
  <path d="M163 450C166 468 220 470 251 478" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M418 450C416 468 358 470 326 478" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="615" y="310" width="560" height="270" rx="18" class="lane" stroke="#9b75c9"/>
  <text x="635" y="338" class="label muted">03 BETA RESEARCH / 中低频 Beta</text>
  <g transform="translate(645 365)">
    <rect width="225" height="83" rx="12" class="node purple-fill"/>
    <text x="14" y="23" class="node-code">B0 / CANDIDATES</text><text x="14" y="48" class="node-title">候选因子库</text><text x="14" y="68" class="tiny muted">价格 · 估值 · 流动性 · 订单流</text>
  </g>
  <g transform="translate(910 365)">
    <rect width="225" height="83" rx="12" class="node orange-fill"/>
    <text x="14" y="23" class="node-code">B1 / FALSIFY</text><text x="14" y="48" class="node-title">20 日稳健性检验</text><text x="14" y="68" class="tiny muted">20 phases · null · residual IC</text>
  </g>
  <g transform="translate(700 480)">
    <rect width="390" height="70" rx="12" class="node green-fill"/>
    <text x="15" y="23" class="node-code">B2 / ATTRIBUTION &amp; SYNTHESIS</text><text x="15" y="46" class="node-title">独立增量识别、归因与合成</text><text x="15" y="62" class="tiny muted">baseline → incremental information → research verdict</text>
  </g>
  <path d="M872 406C888 395 895 395 908 406" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M1023 450C1016 470 961 471 934 478" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M757 450C764 470 818 471 846 478" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M1055 552C1116 576 1112 430 1094 415" class="feedback" marker-end="url(#arrowOrange)"/>
  <text x="1014" y="572" class="tiny" fill="#bd632a">无独立增量 → 淘汰并登记</text>

  <path d="M57 618C276 603 466 632 680 613C820 601 952 604 1142 617" class="pass" marker-end="url(#arrowGreen)"/>
  <text x="45" y="645" class="tiny muted">OUTPUT: DAILY DATASET · FACTOR IMPLEMENTATION · VALIDATION REPORT · RESEARCH REGISTRY</text>
</svg>
