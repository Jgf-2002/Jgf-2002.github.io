<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Alpha、Beta 与宏观配置研究系统</title>
  <desc id="desc">从多源金融数据、PIT 对齐和质量检查出发，进入横截面 Alpha、市场 Beta 与宏观配置研究；通过样本外、空检验、增量检验、敏感性审计和人工判断完成研究交付。</desc>
  <defs>
    <filter id="paperNoise" x="-3%" y="-5%" width="106%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#5e7fa5"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#cf7431"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#3f9164"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#8759b2"/></marker>
    <style>
      .bg{fill:#fcfbf8}.ink{fill:#24364a}.muted{fill:#728092}.label{font:italic 15px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif;letter-spacing:.05em}.small{font:12px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif}.tiny{font:10px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif}.node-title{font:700 18px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif;fill:#20334a}.node-code{font:italic 11px 'Segoe Print','KaiTi',sans-serif;fill:#4779b7}.node-note{font:12px 'Segoe Print','KaiTi','Microsoft YaHei',sans-serif;fill:#6e7988}.lane{fill:none;stroke-width:1.6;stroke-dasharray:8 7}.node{stroke-width:1.4;filter:url(#paperNoise)}.blue-fill{fill:#e9f0f7;stroke:#7fa5cb}.gray-fill{fill:#f2f3f4;stroke:#aab1ba}.gold-fill{fill:#f5f0df;stroke:#c8aa62}.green-fill{fill:#eaf3ed;stroke:#7fa58b}.purple-fill{fill:#f1edf7;stroke:#9e7bc2}.orange-fill{fill:#f8eee7;stroke:#d79364}.flow{fill:none;stroke:#6685a8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#cf7431;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round}.pass{fill:none;stroke:#3f9164;stroke-width:2.2;stroke-linecap:round}.human{fill:none;stroke:#8759b2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="bg" width="1200" height="730" rx="18"/>
  <text x="30" y="37" class="label ink" style="font-size:22px">量化研究与工程 / Quantitative Research System</text>
  <text x="31" y="62" class="small muted">As-of data · OOS validation · reproducible research handoff</text>
  <g filter="url(#paperNoise)">
    <rect x="792" y="20" width="374" height="48" rx="12" fill="#f5f0df" stroke="#d5c18d"/>
  </g>
  <text x="812" y="40" class="tiny muted">253 Factor Specs · 178 Real Implementations</text>
  <text x="812" y="57" class="tiny muted">131 GB PIT · Daily IC / RankIC · OOS Audit</text>

  <!-- DATA PLANE -->
  <rect x="25" y="88" width="1150" height="180" rx="18" class="lane" stroke="#8eb6d9"/>
  <text x="45" y="115" class="label muted">DATA PLANE / 数据与时间点约束</text>
  <text x="924" y="114" class="tiny muted">raw → normalize → PIT → quality → cache</text>

  <g transform="translate(55 135)">
    <rect width="230" height="100" rx="13" class="node blue-fill"/>
    <text x="17" y="25" class="node-code">N0 / SOURCE</text>
    <text x="17" y="52" class="node-title">多源金融数据</text>
    <text x="17" y="75" class="node-note">Tushare · 聚源 JY · 行情</text>
    <text x="17" y="92" class="tiny muted">财务 / 分析师 / 市场数据</text>
  </g>
  <g transform="translate(335 135)">
    <rect width="230" height="100" rx="13" class="node purple-fill"/>
    <text x="17" y="25" class="node-code">N1 / AS-OF</text>
    <text x="17" y="52" class="node-title">PIT 投影</text>
    <text x="17" y="75" class="node-note">available_date · revision</text>
    <text x="17" y="92" class="tiny muted">只使用当时真实可见信息</text>
  </g>
  <g transform="translate(615 135)">
    <rect width="230" height="100" rx="13" class="node gold-fill"/>
    <text x="17" y="25" class="node-code">N2 / QUALITY</text>
    <text x="17" y="52" class="node-title">质量与版本控制</text>
    <text x="17" y="75" class="node-note">schema · null · freshness</text>
    <text x="17" y="92" class="tiny muted">upstream check · no empty output</text>
  </g>
  <g transform="translate(895 135)">
    <rect width="230" height="100" rx="13" class="node green-fill"/>
    <text x="17" y="25" class="node-code">N3 / RESEARCH INPUT</text>
    <text x="17" y="52" class="node-title">共享缓存与面板</text>
    <text x="17" y="75" class="node-note">Dolphin · PySim · PIT panel</text>
    <text x="17" y="92" class="tiny muted">统一供给 Alpha / Beta / Macro</text>
  </g>
  <path d="M287 185C305 174 316 174 333 185" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M567 185C585 174 596 174 613 185" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M847 185C865 174 876 174 893 185" class="flow" marker-end="url(#arrowBlue)"/>
  <text x="290" y="169" class="tiny muted">visibility time</text>
  <text x="574" y="169" class="tiny muted">DQ gates</text>
  <text x="850" y="169" class="tiny muted">cache load</text>

  <!-- ALPHA &amp; BETA RESEARCH PLANE -->
  <rect x="25" y="292" width="1150" height="190" rx="18" class="lane" stroke="#9b75c9"/>
  <text x="45" y="320" class="label muted">ALPHA &amp; BETA RESEARCH / 因子研究与证伪</text>
  <text x="785" y="319" class="tiny" fill="#8759b2">锁定假设 → 生成 → 评估 → 证伪 → 晋级</text>

  <g transform="translate(55 343)">
    <rect width="180" height="98" rx="13" class="node purple-fill"/>
    <text x="15" y="24" class="node-code">A0 / HYPOTHESIS</text>
    <text x="15" y="50" class="node-title">因子假设</text>
    <text x="15" y="72" class="node-note">机制 · 方向 · 窗口</text>
    <text x="15" y="89" class="tiny muted">pre-register / lock</text>
  </g>
  <g transform="translate(270 343)">
    <rect width="180" height="98" rx="13" class="node blue-fill"/>
    <text x="15" y="24" class="node-code">A1 / BUILD</text>
    <text x="15" y="50" class="node-title">信号实现</text>
    <text x="15" y="72" class="node-note">Fundamental Alpha · Beta</text>
    <text x="15" y="89" class="tiny muted">Dolphin / PySim batch</text>
  </g>
  <g transform="translate(485 343)">
    <rect width="180" height="98" rx="13" class="node gray-fill"/>
    <text x="15" y="24" class="node-code">A2 / EVALUATE</text>
    <text x="15" y="50" class="node-title">截面 / 时序评估</text>
    <text x="15" y="72" class="node-note">IC · RankIC · coverage</text>
    <text x="15" y="89" class="tiny muted">rolling OOS · annual stability</text>
  </g>
  <g transform="translate(700 343)">
    <rect width="180" height="98" rx="13" class="node orange-fill"/>
    <text x="15" y="24" class="node-code">A3 / FALSIFY</text>
    <text x="15" y="50" class="node-title">稳健性检验</text>
    <text x="15" y="72" class="node-note">null · residual IC · ablation</text>
    <text x="15" y="89" class="tiny muted">collinearity · leakage audit</text>
  </g>
  <g transform="translate(915 343)">
    <rect width="210" height="98" rx="13" class="node green-fill"/>
    <text x="15" y="24" class="node-code">A4 / VERDICT</text>
    <text x="15" y="50" class="node-title">证据分级</text>
    <text x="15" y="72" class="node-note">PASS · WATCH · DROP</text>
    <text x="15" y="89" class="tiny muted">保留失败结论与审计记录</text>
  </g>
  <path d="M237 392C250 383 257 383 268 392" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M452 392C465 383 472 383 483 392" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M667 392C680 383 687 383 698 392" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M882 392C895 383 902 383 913 392" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M1018 443C994 468 821 472 614 466C386 460 204 475 145 443" class="feedback" marker-end="url(#arrowOrange)"/>
  <text x="483" y="477" class="tiny" fill="#bd632a">FAIL / WATCH → 带着 reason + evidence 回到假设层 ↻</text>

  <!-- MACRO + HUMAN GATE -->
  <rect x="25" y="508" width="760" height="160" rx="18" class="lane" stroke="#8eb6d9"/>
  <text x="45" y="536" class="label muted">MACRO RESEARCH LANE / 宏观择时与配置</text>
  <g transform="translate(55 557)">
    <rect width="190" height="78" rx="12" class="node blue-fill"/>
    <text x="14" y="23" class="node-code">M0 / PANEL</text>
    <text x="14" y="47" class="node-title">月频 PIT 面板</text>
    <text x="14" y="67" class="tiny muted">macro · index · multi-asset</text>
  </g>
  <g transform="translate(285 557)">
    <rect width="190" height="78" rx="12" class="node gold-fill"/>
    <text x="14" y="23" class="node-code">M1 / SIGNAL</text>
    <text x="14" y="47" class="node-title">状态与配置信号</text>
    <text x="14" y="67" class="tiny muted">regime · allocation</text>
  </g>
  <g transform="translate(515 557)">
    <rect width="220" height="78" rx="12" class="node green-fill"/>
    <text x="14" y="23" class="node-code">M2 / VERIFY</text>
    <text x="14" y="47" class="node-title">回测与敏感性审计</text>
    <text x="14" y="67" class="tiny muted">determinism · historical as-of</text>
  </g>
  <path d="M247 596C262 586 270 586 283 596" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M477 596C492 586 500 586 513 596" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="815" y="508" width="360" height="160" rx="18" class="lane" stroke="#c188de"/>
  <text x="836" y="536" class="label muted">REVIEW &amp; HANDOFF / 人工决策</text>
  <g class="human" transform="translate(842 554)">
    <circle cx="18" cy="10" r="9"/><path d="M18 20V50M18 30L3 41M18 30L33 41M18 50L6 68M18 50L31 68"/>
  </g>
  <path d="M1020 443C1041 472 1027 505 1004 545" class="pass" marker-end="url(#arrowGreen)"/>
  <text x="1038" y="491" class="tiny" fill="#3f9164">PASS</text>
  <g transform="translate(900 550)">
    <rect width="235" height="88" rx="12" class="node purple-fill"/>
    <text x="16" y="25" class="node-code">H0 / HUMAN GATE</text>
    <text x="16" y="51" class="node-title">研究交付</text>
    <text x="16" y="72" class="node-note">可复现 · 可追溯 · 可解释</text>
  </g>
  <path d="M882 592C888 585 892 585 898 592" class="human" marker-end="url(#arrowPurple)"/>

  <path d="M55 698C276 684 468 711 680 693C814 682 945 684 1137 696" class="pass"/>
  <text x="45" y="720" class="tiny muted">STATE: DATA_READY → SIGNAL_CANDIDATE → OOS_REVIEW → PASS / WATCH / DROP → RESEARCH_HANDOFF</text>
</svg>
